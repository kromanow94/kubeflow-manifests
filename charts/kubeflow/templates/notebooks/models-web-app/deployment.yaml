{{- if (include "kubeflow.notebooks.modelsWebApp.enabled" . | eq "true") -}}

{{- $autoscalingEnabled := include "kubeflow.notebooks.modelsWebApp.autoscaling.enabled" . -}}
{{- $replicas := include "kubeflow.notebooks.modelsWebApp.autoscaling.minReplicas" . -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeflow.notebooks.modelsWebApp.name" . }}
  namespace: {{ include "kubeflow.namespace" . }}
spec:
  {{- if (eq $autoscalingEnabled "false") }}
  replicas: {{ $replicas }}
  {{- end }}

  selector:
    matchLabels:
      {{- include "kubeflow.notebooks.modelsWebApp.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "kubeflow.notebooks.modelsWebApp.selectorLabels" . | nindent 8 }}

    spec:
      containers:
      - image: {{ include "kubeflow.notebooks.modelsWebApp.image" . }}
        imagePullPolicy: {{ include "kubeflow.notebooks.modelsWebApp.imagePullPolicy" . }}
        name: {{ include "kubeflow.notebooks.modelsWebApp.baseName" . }}
        {{- with .Values.notebooks.modelsWebApp.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: {{ include "kubeflow.notebooks.modelsWebApp.configMapName" . }}
        ports:
        - containerPort: 5000
          name: http
        livenessProbe:
          httpGet:
            path: /healthz/liveness
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /healthz/readiness
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
          successThreshold: 1
      serviceAccountName: {{ include "kubeflow.notebooks.modelsWebApp.serviceAccountName" . }}
      {{- with include "kubeflow.notebooks.modelsWebApp.nodeSelector" . }}
      nodeSelector:
        {{- . | nindent 8 }}
      {{- end }}

      {{- with include "kubeflow.notebooks.modelsWebApp.tolerations" . }}
      tolerations:
        {{- . | nindent 8 }}
      {{- end }}

      {{- with include "kubeflow.notebooks.modelsWebApp.affinity" . }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}

      {{- with include "kubeflow.notebooks.modelsWebApp.topologySpreadConstraints" . }}
      topologySpreadConstraints:
        {{- . | nindent 8 }}
      {{- end }}

{{- end }}
