apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubeflow.katib.controller.name" . }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - {{ include "kubeflow.katib.controller.name" . }} # katib mutating webhook to add metrics logger
  # https://www.elastic.co/guide/en/cloud-on-k8s/1.1/k8s-webhook-network-policies.html
  # The kubernetes api server must reach the webhook
  ingress:
    - ports: # webhook
        - protocol: TCP
          port: {{ include "kubeflow.katib.controller.svc.webhook.targetPort" . }}
  #    - ports: # metrics
  #        - protocol: TCP
  #          port: 8080
  policyTypes:
    - Ingress
